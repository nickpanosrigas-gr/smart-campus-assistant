services:
  whisper:
    build: .
    image: whisper-service:latest
    container_name: whisper-api
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  whisper_cache: