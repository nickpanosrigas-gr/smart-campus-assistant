# docker-compose.yml
version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-campus-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      # ==========================================
      # SETTINGS.PY ENVIRONMENT VARIABLES
      # ==========================================
      
      # ThingsBoard
      - THINGSBOARD_BASE_URL=http://your-thingsboard-url.com
      - THINGSBOARD_USERNAME=your_username
      - THINGSBOARD_PASSWORD=your_password
      
      # Gemini
      - GOOGLE_API_KEY=your_google_api_key
      - GEMINI_MODEL=gemini-1.5-pro-latest
      
      # Qdrant
      - QDRANT_URL=http://your-qdrant-url.com:6333
      - QDRANT_API_KEY=your_qdrant_api_key
      - QDRANT_COLLECTION_NAME=smart_campus_knowledge
      
      # Langfuse
      - LANGFUSE_SECRET_KEY=sk-lf-...
      - LANGFUSE_PUBLIC_KEY=pk-lf-...
      - LANGFUSE_HOST=https://cloud.langfuse.com
      
      # Local AI Endpoints
      - OLLAMA_BASE_URL=http://your-ollama-url:11434
      - OLLAMA_MODEL=qwen2.5
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_NUM_CTX=8192
      
      # Whisper
      - WHISPER_API_URL=http://your-whisper-url
      - WHISPER_MODEL=whisper-1
      - WHISPER_LANGUAGE=en
      
      # Telegram
      - TELEGRAM_BOT_TOKEN=your_bot_token
      - TELEGRAM_ALLOWED_USER_ID=123456789
      
      # Astral (Location for time/sun calculations)
      - LATITUDE=37.9838   # e.g., Athens, Greece
      - LONGITUDE=23.7275
      - TIMEZONE=Europe/Athens

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-campus-frontend
    ports:
      - "3000:3000"
    environment:
      # If your frontend needs to know where the backend is via env vars, set it here.
      # Usually, Next.js hits the backend via the browser, so localhost:8000 is used.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend